<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment received — GigBooks</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;
    background:#FBFAF6;color:#20221D;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  .card{max-width:420px;text-align:center;}
  img{width:64px;height:64px;}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;color:#2F4A2E;font-size:30px;margin:18px 0 8px;}
  p{color:#4B4E43;line-height:1.6;margin:0;}
</style>
</head>
<body>
  <div class="card">
    <img src="assets/logo-horse.png" alt="">
    <h1 id="t">Thank you, payment received</h1>
    <p id="m">The invoice is marked paid. You'll get a receipt from Stripe by email. You can close this page.</p>
  </div>
  <script>
    if (new URLSearchParams(location.search).has("cancelled")) {
      document.getElementById("t").textContent = "Payment not completed";
      document.getElementById("m").textContent = "No payment was taken. You can go back to the invoice link whenever you're ready.";
    }
  </script>
</body>
</html>
